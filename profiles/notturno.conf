# profilo del turno notturno — UNA dichiarazione, ricomposta a ogni ciclo
# (studio deepseek-harness profiles/bundles, 2026-09-23: il nostro exec-per-ciclo
# e' un hot-reload gratis: questo file e' l'unica fonte dei default run-time.
# Ogni riga: CHIAVE=VALORE, le # sono commenti. Il loader nel turno legge,
# valida, e i default nel codice diventano fallback di emergenza.)

# il cervello
MODELLO=qwen3.8-27b:iq3s
THINK=false

# i tempi (secondi)
SONDA_SEC=240
SONDA_ROUND=6
AGENTE_TIMEOUT=600
AGENTE_MAX_TURNI=8
CICLO_MIN_SEC=60

# i limiti del gate miglioria
GATE_MAX_RIGHE=40
GATE_MAX_FILE=2

# il censore
CENSORE_MAX_RIGHE=60
CENSORE_MAX_FILE=3
CENSORE_QUARANTENA_MIN=20
CENSORE_BUDGET_GIORNO=5

# la caccia (D11, Luca 2026-09-23): due pause distinte
# - dopo che una repo e' dichiarata pulita, il turno non la ricaccia per (secondi):
CACCIATORIA_COOLDOWN_SEC=1800
# - un file giudicato «niente da migliorare» in una categoria non si ritocca per (secondi):
MIGLIORIA_COOLDOWN_SEC=21600

# l'apprendimento (/il learn)
IMPARA_ORA=22
