# lente-documenti.vale.ini — lo stile di CASA per la lente prosa (Vale, offline).
# Una sola legge, quella che il pre-commit gia' impone al codice: ASCII.
# La casa scrive «e'» non «è» (registro, SAL, commenti, documenti: una regola sola).
MinAlertLevel = error
StylesPath = vale

[*.md]
BasedOnStyles = casa

[*.mdx]
BasedOnStyles = casa
